; IIIStreakLights.ini
; Optional settings for IIIStreakLights.asi.
; Keep this file in the SAME folder as the plugin, not necessarily the game working directory.
; Missing file or key = the built-in default in the source code.
;
; Scale/brightness settings use plain numeric values; 100 is the baseline.
; Distances use GTA world units. Angles are in degrees (0..180).
; For angle fade start/end pairs, StartDegrees is normally larger than EndDegrees.
; Values are clamped to safe ranges. Fade angle pairs with invalid ordering use code defaults.

[General]
Enabled=true

[Front]
StreakLength=100
StreakHeight=100
StreakBrightness=100
CoreSize=100
CoreBrightness=65
AngleFadeStartDegrees=151.7
AngleFadeEndDegrees=104.5
CoreAngleFadeStartDegrees=174.3
CoreAngleFadeEndDegrees=151.7
CoreDistanceFadeStart=23
CoreDistanceFadeEnd=32

[Rear]
; Rear-light ground projection style:
; 0 = Off (only the ground projection is disabled; streak visibility is controlled separately)
; 1 = Vice City style (compact shad_exp texture projection)
; 2 = LCS-style (smaller reversed headlight projection; also projects white reverse lights)
; Projection style affects ground projection only; streak visibility has its own setting below.
; The red projection is active when tail/brake lamps are physically lit, even in daylight.
; Ground projection range in GTA world units; default is increased from 27 to 60.
RearProjectionStyle=2
RearProjectionDrawDistance=60
; Offset behind the averaged rear-lamp position for vehicles with two rear lamps.
; One centered projection is used per vehicle; smaller offset keeps it close to the bumper.
RearProjectionOffset=0.20
; Offset behind the rear-lamp dummy for motorcycles, Quadbike, tractor and configured single-lamp models.
SingleLampProjectionOffset=0.20
; IDs forced to a single, centered rear source. Tractor (531), motorcycles and Quadbike are built in.
; Single-lamp projections use the second stock headlight texture variant (headlight1).
; Append custom IDs separated by commas, e.g. 531, 600, 601.
SingleProjectionModelIDs=531
; Controls red tail-lamp streak visibility: 0 = mainly at distance (default), 1 = visible nearby.
; White reverse streaks remain visible nearby and use StreakDrawDistance for their draw limit.
RearStreakVisibilityStyle=0
; Rear streaks (red tail/brake and white reverse) now use the same base height as front streaks.
StreakLength=100
StreakHeight=100
StreakBrightness=100
SideCoreSize=100
SideCoreBrightness=100
DistanceFadeStart=9
DistanceFadeEnd=23
RoundEntryAngleStartDegrees=101.5
RoundEntryAngleEndDegrees=83.1
RoundExitAngleStartDegrees=73.7
RoundExitAngleEndDegrees=38.7

[Reverse]
; White reverse effects are enabled by default on standard automobiles only. Set false to disable.
WhiteLightsEnabled=true
StreakLength=100
StreakBrightness=100
CoreSize=100
CoreBrightness=100
BikeStreakSize=55
BikeCoreSize=60
BikeQuadBrightness=35
CoreAngleFadeStartDegrees=36.9
CoreAngleFadeEndDegrees=14.1

[Advanced]
SideAngleExponent=4
StreakDistanceFadeStart=25
; Maximum camera-space depth for the custom front/rear streak sprites. Default remains 40.
StreakDrawDistance=40
